<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="1280" height="920" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">
    Kiến trúc Tổng thể Mô hình Đề xuất (MSSF_plus / CONCORD-DSE) theo Protocol v2
  </text>

  <!-- ==================== PHASE I ==================== -->
  <rect x="24" y="52" width="1232" height="232" rx="10" ry="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="44" y="78" font-size="15" font-weight="bold" fill="#1e293b">
    Pha I — Tiền xử lý Đa khung nhìn Không rò rỉ theo từng Fold (chỉ dựng từ Tập Train 80%)
  </text>

  <!-- Box P1-1: Train pairs & profile views -->
  <rect x="44" y="94" width="265" height="82" rx="7" ry="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="176" y="116" font-size="13" font-weight="bold" text-anchor="middle" fill="#0c4a6e">Tập Train (80%): fold_split.train</text>
  <text x="176" y="136" font-size="12" text-anchor="middle" fill="#0f172a">Ma trận tần suất drug_side_train (750 × 994)</text>
  <text x="176" y="154" font-size="12" text-anchor="middle" fill="#0f172a">Tính D9, D10 (750×750) &amp; S3, S4 (994×994)</text>

  <!-- Box P1-2: Static views -->
  <rect x="44" y="190" width="265" height="78" rx="7" ry="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="176" y="212" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">Khung nhìn Tĩnh (Drug &amp; SE)</text>
  <text x="176" y="232" font-size="12" text-anchor="middle" fill="#334155">9 Drug views tĩnh: D1..D8, D11 (9 × 750×750)</text>
  <text x="176" y="250" font-size="12" text-anchor="middle" fill="#334155">2 SE views tĩnh: S1, S2 + C2: MedDRA S5 (994×994)</text>

  <!-- Box P1-3: C1 Cross-fitting Imputation -->
  <rect x="355" y="94" width="380" height="82" rx="7" ry="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.0"/>
  <text x="545" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">[C1 — Đóng góp chính] Cross-fitting Bù khuyết (K = 5)</text>
  <text x="545" y="135" font-size="12" text-anchor="middle" fill="#0f172a">Chia train_drugs thành K=5 nhóm (10% early-stop nội bộ)</text>
  <text x="545" y="153" font-size="12" text-anchor="middle" fill="#0f172a">• Thuốc train: dự đoán out-of-fold → fallback_d9, fallback_d10</text>
  <text x="545" y="169" font-size="12" text-anchor="middle" fill="#0f172a">• Thuốc val_select / val_calib / test: trung bình K=5 regressor</text>

  <!-- Box P1-4: C5 Multi-View Spectral Clustering -->
  <rect x="355" y="190" width="380" height="78" rx="7" ry="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="545" y="212" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400e">[C5] Phân cụm Phổ Đa khung nhìn trên train_drugs</text>
  <text x="545" y="232" font-size="12" text-anchor="middle" fill="#0f172a">Tự động chọn K* (0.6·Silhouette + 0.4·Eigengap)</text>
  <text x="545" y="250" font-size="12" text-anchor="middle" fill="#0f172a">Sinh nhãn mềm Leave-One-Out: q_(d,s) = (1-α)e_y + α·P_(-d)</text>

  <!-- Box P1-5: Assembled Views + Availability -->
  <rect x="785" y="94" width="445" height="174" rx="7" ry="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="1007" y="118" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">Biểu diễn Đa khung nhìn &amp; Chỉ báo Hiện diện (Pre-imputation)</text>
  <text x="1007" y="142" font-size="12" text-anchor="middle" fill="#0f172a">• 11 Drug Views: X_d ∈ R^(750 × 8250)  |  Chỉ báo hiện diện a_d ∈ {0,1}^(750 × 11)</text>
  <text x="1007" y="164" font-size="12" text-anchor="middle" fill="#0f172a">• [C2] 5 SE Views: X_s ∈ R^(994 × 4970)  |  Chỉ báo hiện diện a_s ∈ {0,1}^(994 × 5)</text>
  <text x="1007" y="186" font-size="12" text-anchor="middle" fill="#0f172a">• Vector dự phòng OOF: fallback_d9, fallback_d10 ∈ R^(750 × 750)</text>
  <text x="1007" y="208" font-size="12" text-anchor="middle" fill="#0f172a">• Nhãn mềm huấn luyện C5: q_(d,s) ∈ Δ^4 (chỉ áp dụng cho cặp train)</text>
  <text x="1007" y="230" font-size="11" font-style="italic" text-anchor="middle" fill="#047857">(Mọi nhãn đánh giá val_select, val_calib, test giữ nguyên 5 mức SIDER gốc)</text>

  <!-- Phase I Arrows -->
  <line x1="309" y1="135" x2="349" y2="135" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="309" y1="215" x2="349" y2="155" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="309" y1="155" x2="349" y2="215" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="309" y1="230" x2="349" y2="230" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="735" y1="135" x2="779" y2="135" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="735" y1="228" x2="779" y2="210" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ==================== PHASE II ==================== -->
  <rect x="24" y="302" width="1232" height="390" rx="10" ry="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="44" y="328" font-size="15" font-weight="bold" fill="#1e293b">
    Pha II — Kiến trúc Mạng Đa tỷ lệ (MSSFPlusModel) &amp; Hàm Mục tiêu Thứ tự Đơn giản hóa (MSSFPlusCriterion)
  </text>

  <!-- Box P2-1: C1 View Dropout + AvailabilityModulator -->
  <rect x="44" y="346" width="1192" height="58" rx="7" ry="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.0"/>
  <text x="640" y="368" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">
    [C1] Tầng Điều biến Đầu vào: Training Profile View Dropout (p = 0.25) + AvailabilityModulator (Drug &amp; SE)
  </text>
  <text x="640" y="388" font-size="12" text-anchor="middle" fill="#0f172a">
    Khi train: với xác suất p=0.25, thay (D9, D10) bằng (fallback_d9, fallback_d10) out-of-fold &amp; đặt a_(d,9)=a_(d,10)=0  |  Điều biến: X̃ = X · (1 + 0.2·tanh(MLP(a))) + (1 - a)·m_v
  </text>

  <!-- Arrow from Phase I to Phase II -->
  <line x1="1007" y1="268" x2="1007" y2="340" stroke="#059669" stroke-width="2.0" marker-end="url(#arrow-green)"/>

  <!-- 3 Encoders -->
  <rect x="44" y="426" width="372" height="84" rx="7" ry="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="230" y="448" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Nhánh 1: EncoderConnection (Autoencoder)</text>
  <text x="230" y="468" font-size="12" text-anchor="middle" fill="#334155">Ghép nối [X̃_d || X̃_s] (13220-D) → Linear(256)</text>
  <text x="230" y="486" font-size="12" text-anchor="middle" fill="#334155">→ Self-Attn(4 heads) → feature1 (128-D) + rec_con</text>

  <rect x="454" y="426" width="372" height="84" rx="7" ry="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="640" y="448" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Nhánh 2: EncoderAddition (Autoencoder)</text>
  <text x="640" y="468" font-size="12" text-anchor="middle" fill="#334155">Cộng gộp xuyên view [ΣX̃_d || ΣX̃_s] (1744-D) → Linear(256)</text>
  <text x="640" y="486" font-size="12" text-anchor="middle" fill="#334155">→ Self-Attn(4 heads) → feature2 (128-D) + rec_add</text>

  <rect x="864" y="426" width="372" height="84" rx="7" ry="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="1050" y="448" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Nhánh 3: Preprocess + CrossProduction (2D-CNN)</text>
  <text x="1050" y="468" font-size="12" text-anchor="middle" fill="#334155">Chiếu 11 Drug &amp; 5 SE views về 128-D → Tích ngoài 55×128×128</text>
  <text x="1050" y="486" font-size="12" text-anchor="middle" fill="#334155">→ 3 tầng Conv2d(k=4, s=4) → feature3 (128-D)</text>

  <!-- Arrows from Modulator to 3 Encoders -->
  <line x1="230" y1="404" x2="230" y2="421" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="640" y1="404" x2="640" y2="421" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1050" y1="404" x2="1050" y2="421" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Fusion + BVI + Classifier -->
  <rect x="44" y="534" width="372" height="68" rx="7" ry="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="230" y="556" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Hợp nhất Đa tỷ lệ &amp; Self-Attention</text>
  <text x="230" y="576" font-size="12" text-anchor="middle" fill="#334155">Ghép [feature1 || feature2 || feature3] (384-D)</text>
  <text x="230" y="592" font-size="12" text-anchor="middle" fill="#334155">→ Multi-Head Self-Attention (heads = 4)</text>

  <rect x="454" y="534" width="372" height="68" rx="7" ry="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="640" y="556" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Bayesian Variational Inference (BVI)</text>
  <text x="640" y="576" font-size="12" text-anchor="middle" fill="#334155">GaussianParametrizer → μ (64-D), log σ² (64-D)</text>
  <text x="640" y="592" font-size="12" text-anchor="middle" fill="#334155">z = μ + ε·σ (train)  |  z = μ (eval)</text>

  <rect x="864" y="534" width="372" height="68" rx="7" ry="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <text x="1050" y="556" font-size="13" font-weight="bold" text-anchor="middle" fill="#0c4a6e">Classifier MLP &amp; Xác suất 5 Lớp</text>
  <text x="1050" y="576" font-size="12" text-anchor="middle" fill="#0f172a">Linear(64 → 32) → LeakyReLU → Dropout(0.4) → Out</text>
  <text x="1050" y="592" font-size="12" text-anchor="middle" fill="#0f172a">5 logits (ce / emd) hoặc 4 cond-logits (corn) → p ∈ Δ^4</text>

  <!-- Arrows from Encoders to Fusion -> BVI -> Classifier -->
  <line x1="230" y1="510" x2="230" y2="529" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="640" y1="510" x2="340" y2="529" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1050" y1="510" x2="390" y2="529" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="416" y1="568" x2="449" y2="568" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="826" y1="568" x2="859" y2="568" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Loss Box -->
  <rect x="44" y="618" width="1192" height="58" rx="7" ry="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="640" y="640" font-size="13" font-weight="bold" text-anchor="middle" fill="#991b1b">
    Hàm Mất mát Tổng hợp (MSSFPlusCriterion):  L_total = L_C3(logits, q_(d,s); w) + 0.001·L_KL + 0.0001·L_rec,con + 0.0001·L_rec,add
  </text>
  <text x="640" y="660" font-size="12" text-anchor="middle" fill="#0f172a">
    • Lựa chọn mục tiêu Ordinal C3 ∈ {ce, emd, corn} × {có/không trọng số lớp w_k} trên nhãn mềm C5 (với corn: chuyển q_(d,s) sang P(y &gt; k))  |  • Cluster head phụ mặc định TẮT
  </text>

  <line x1="1050" y1="602" x2="1050" y2="614" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="640" y1="602" x2="640" y2="614" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ==================== PHASE III ==================== -->
  <rect x="24" y="710" width="1232" height="186" rx="10" ry="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="44" y="736" font-size="15" font-weight="bold" fill="#1e293b">
    Pha III — Chọn Checkpoint trên val_select &amp; Tiên đoán Bảo toàn Thứ tự Liên thông Hậu kiểm [C4]
  </text>

  <rect x="44" y="754" width="360" height="122" rx="7" ry="7" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="224" y="778" font-size="13" font-weight="bold" text-anchor="middle" fill="#0c4a6e">1. Tập val_select (10%)</text>
  <text x="224" y="800" font-size="12" text-anchor="middle" fill="#0f172a">• Chọn Best Epoch theo 5-class Macro-F1</text>
  <text x="224" y="820" font-size="12" text-anchor="middle" fill="#0f172a">• Chọn hàm mục tiêu C3 &amp; quyết định ablation</text>
  <text x="224" y="840" font-size="12" text-anchor="middle" fill="#0f172a">• Tune siêu tham số (ngân sách ≤ 6 cấu hình)</text>
  <text x="224" y="860" font-size="11" font-style="italic" text-anchor="middle" fill="#0369a1">(Tuyệt đối không dùng tập test để chọn mô hình)</text>

  <rect x="454" y="754" width="360" height="122" rx="7" ry="7" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/>
  <text x="634" y="778" font-size="13" font-weight="bold" text-anchor="middle" fill="#581c87">2. Tập val_calib (10%) — Hiệu chỉnh [C4]</text>
  <text x="634" y="800" font-size="12" text-anchor="middle" fill="#0f172a">• Mở rộng khoảng tham lam liên thông từ ŷ = argmax p</text>
  <text x="634" y="820" font-size="12" text-anchor="middle" fill="#0f172a">• Tính điểm bất tương thích Ordinal_LAC &amp; Ordinal_APS</text>
  <text x="634" y="840" font-size="12" text-anchor="middle" fill="#0f172a">• Lấy phân vị hữu hạn mẫu q̂_(1-α) (α = 0.10 → 90%)</text>
  <text x="634" y="860" font-size="11" font-style="italic" text-anchor="middle" fill="#6b21a8">(Split B: chia theo thuốc → bảo đảm độ phủ trung bình theo thuốc)</text>

  <rect x="864" y="754" width="372" height="122" rx="7" ry="7" fill="#ecfdf5" stroke="#059669" stroke-width="2.0"/>
  <text x="1050" y="778" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">3. Tập test (10% — Đánh giá 1 lần duy nhất)</text>
  <text x="1050" y="800" font-size="12" text-anchor="middle" fill="#0f172a">• Dự đoán điểm: ŷ = argmax_k p_k (Macro-F1, QWK, MAE, ...)</text>
  <text x="1050" y="820" font-size="12" text-anchor="middle" fill="#0f172a">• Khoảng thứ tự liên thông 100%: C(x) = [l(x), u(x)]</text>
  <text x="1050" y="840" font-size="12" text-anchor="middle" fill="#0f172a">• Độ phủ theo cặp, theo lớp (c0..c4) &amp; theo từng thuốc test</text>
  <text x="1050" y="860" font-size="12" text-anchor="middle" fill="#0f172a">  (Mean, Std, tỷ lệ thuốc có coverage &lt; 80%)</text>

  <line x1="404" y1="815" x2="448" y2="815" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="814" y1="815" x2="858" y2="815" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow-green)"/>
</svg>
